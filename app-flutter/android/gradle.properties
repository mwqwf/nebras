org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
android.useAndroidX=true

# Kotlin daemon: run the compiler in-process to avoid "Could not connect to Kotlin
# compile daemon" errors when the daemon JVM cannot start (memory pressure / antivirus).
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
kotlin.compiler.execution.strategy=in-process

# Avoid AAB packaging error on Arabic-locale Windows: bundletool expects Latin digits in
# multi-dex names (classes2.dex), not Eastern-Arabic numerals (classes٢.dex).
systemProp.user.language=en
systemProp.user.country=US
